name: ComH3@ - build e publica imagem (HeadendAI)

# HeadendAI (06/09/2026): workflow proprio, separado do docker.yaml original
# do upstream (aquele builda 5 variantes x 2 arquiteturas - CUDA/ollama/slim,
# amd64/arm64 - nao precisamos de nada disso, so uma imagem, uma plataforma,
# pro servidor he-zabbix-01). Motivo de existir: mover o build pesado (~4GB
# de pico de RAM, ~6349 modulos Svelte) do servidor de 8GB pra um runner do
# GitHub (16GB RAM) - ver docs/sprint/SPRINT-09.md Parte 5 pro historico
# completo de builds que travaram o servidor.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: comh3-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_HEADEND_API_URL=https://179.105.102.53:9445
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
