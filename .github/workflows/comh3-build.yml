name: ComH3@ - build e publica imagem (HeadendAI)

# HeadendAI (06/09/2026): workflow proprio, separado do docker.yaml original
# do upstream (aquele builda 5 variantes x 2 arquiteturas - CUDA/ollama/slim,
# amd64/arm64 - nao precisamos de nada disso, so uma imagem, uma plataforma,
# pro servidor he-zabbix-01). Motivo de existir: mover o build pesado (~4GB
# de pico de RAM, ~6349 modulos Svelte) do servidor de 8GB pra um runner do
# GitHub (16GB RAM) - ver docs/sprint/SPRINT-09.md Parte 5 pro historico
# completo de builds que travaram o servidor.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: comh3-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # HeadendAI (06/09/2026): testes ANTES do build, e o build so acontece
  # se passarem (needs: testes). O build leva minutos e publica direto em
  # :latest - que e o que o servidor puxa. Publicar primeiro e descobrir
  # depois seria descobrir em producao.
  #
  # O script test:frontend usava `--passWithNoTests` e nao havia nenhum
  # teste: passava verde sem provar nada. Corrigido junto com a entrada do
  # primeiro teste nosso (src/lib/apis/headend/index.test.ts).
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes de frontend (vitest)
        run: npm run test:frontend

  build:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # HeadendAI (06/09/2026): tags de imagem Docker/GHCR precisam ser
      # minusculas - github.repository preserva o case original
      # ("danielColona/open-webui"), o que quebrava o build/push com nome
      # de tag invalido (achado real testando a 1a execucao do workflow).
      - name: Nome da imagem em minusculas
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      # HeadendAI (06/09/2026): necessario pro cache-from/cache-to
      # type=gha abaixo - sem um builder buildx de verdade inicializado,
      # o backend de cache do GitHub Actions falha ("buildx failed",
      # achado real na 2a execucao do workflow).
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O endereco da API nao pode voltar pro repositorio (ele e publico).
      # Vem da variavel HEADEND_API_URL (Settings > Secrets and variables >
      # Actions > Variables). Se ninguem definiu nada, o build PARA aqui em
      # vez de publicar uma imagem com o autocomplete quebrado em silencio -
      # a menos que HEADEND_API_SAME_ORIGIN=true diga, explicitamente, que a
      # API ja esta publicada sob a mesma origem da interface.
      - name: Resolver o endereco da API
        run: |
          URL="${{ vars.HEADEND_API_URL }}"
          if [ -z "$URL" ] && [ "${{ vars.HEADEND_API_SAME_ORIGIN }}" != "true" ]; then
            echo "::error::defina a variavel HEADEND_API_URL do repositorio com a URL publica da API do HeadendAI, ou HEADEND_API_SAME_ORIGIN=true se a API ja e servida na mesma origem da interface."
            exit 1
          fi
          echo "VITE_HEADEND_API_URL=$URL" >> "$GITHUB_ENV"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_HEADEND_API_URL=${{ env.VITE_HEADEND_API_URL }}
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
